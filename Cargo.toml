[package]
name = "wasmtiny"
version = "0.1.0"
edition = "2024"
description = "Tiny Rust WebAssembly runtime based on WAMR"
repository = "https://github.com/seliumlabs/wasmtiny"
license = "Apache-2.0 OR MIT"

[dependencies]
anyhow = { version = "1.0", optional = true }
byteorder = "1.5"
clap = { version = "4.6", features = ["derive"], optional = true }
leb128 = "0.2"
libc = "0.2"
memchr = "2.8"
parking_lot = "0.12"
thiserror = "2.0"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
wast = "259.0"
wat = "1.258"

[features]
default = []
cli = ["clap", "anyhow"]
# Stage 2 of host-region-wait-notify: compile in platform wake emission
# (Linux futex, Windows WakeByAddress, FreeBSD _umtx_op) as a side effect
# of memory.atomic.notify on shared ranges. Build-time only — there is no
# runtime toggle; embedders detect via SharedMemoryRegistry::host_wait_support().
# Gated per-OS inside src/runtime/os_wake.rs; unsupported platforms (macOS)
# compile to a no-op even with this feature on.
platform-wake-emission = []
# Sandbox-escape testing build: corpus-runner instrumentation (verdict
# emission, per-fixture resource caps, budget timer). Compiled into the
# library and the wasmtiny-corpus-runner / wasmtiny-fuzz binaries only;
# absent from default and release builds by construction.
security-test = []

[[bin]]
name = "wasmtiny"
required-features = ["cli"]

[[bin]]
name = "wasmtiny-corpus-runner"
required-features = ["security-test"]

[[bin]]
name = "wasmtiny-fuzz"
required-features = ["security-test"]
