name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      # Execution-mode matrix: the default build is AOT-only, and the
      # interpreter is available behind its feature for both standalone use
      # and differential testing (aot+interpreter). Every combination must
      # compile and pass.
      - name: Run tests (aot + interpreter, differential)
        run: cargo test --features interpreter

      - name: Run tests (interpreter only)
        run: cargo test --no-default-features --features interpreter

      - name: Clippy (aot + interpreter, all targets)
        run: cargo clippy --all-targets --features interpreter -- -D warnings

      # Stage 2 of host-region-wait-notify: the emission conformance tests
      # are gated behind the feature; run them on platforms where the
      # backends are compiled in (Linux; Windows/FreeBSD would need a
      # runner). macOS correctly compiles to a no-op even with the feature.
      - name: Run tests with platform wake emission
        if: runner.os == 'Linux'
        run: cargo test --features platform-wake-emission

      - name: Clippy with platform wake emission
        if: runner.os == 'Linux'
        run: cargo clippy --features platform-wake-emission -- -D warnings

  # Sandbox-escape test build: adversarial corpus, canary harness,
  # boundary fuzzing, and wasmtiny-scoped static gates. Guests are
  # untrusted binaries — no static gate applies to them; all judgement
  # is runtime behaviour observed from outside the sandbox
  # (docs/threat-model.md, openspec sandbox-escape-testing spec).
  # Job-level caps: timeout-minutes bounds the job; per-fixture hard
  # resource caps (rlimits) are applied by the corpus runner itself.
  security-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Dual-build check: both configurations must compile cleanly.
      - name: Build (default features)
        run: cargo build --all-targets

      - name: Build (security-test feature)
        run: cargo build --all-targets --features security-test

      # Testing-build isolation: default builds must contain no
      # security-test instrumentation.
      - name: Check no instrumentation in default build
        run: ./scripts/check_no_instrumentation.sh

      # Static gates.
      - name: Unsafe-code allowlist gate
        run: ./scripts/check_unsafe.sh

      - name: Install cargo deny
        run: cargo install cargo-deny

      - name: Dependency advisories / licenses / duplicates
        run: cargo deny --all-features check

      - name: Clippy (security-test tier)
        run: cargo clippy --all-targets --features security-test -- -D warnings

      # Corpus + traceability + fuzz burst: every adversarial fixture
      # fails closed, canaries hold, the threat model is fully covered,
      # and the fuzz burst completes with no findings.
      - name: Security test suites
        run: cargo test --features security-test

      # Failure paths must be distinct and attributable (broken
      # fixture / hung fixture / off-list unsafe).
      - name: Verify failure paths
        run: ./scripts/verify_failure_paths.sh
