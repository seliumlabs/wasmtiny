[package]
name = "wasmtiny-aotc"
version.workspace = true
edition.workspace = true
description = "Ahead-of-time compiler for the wasmtiny runtime; compiles .wasm to .aot using Cranelift"
repository.workspace = true
license.workspace = true

[[bin]]
name = "wasmtiny-aotc"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { workspace = true, features = ["derive", "help", "std"], optional = true }
cranelift-codegen = { workspace = true, features = ["all-arch", "std"] }
cranelift-entity.workspace = true
cranelift-frontend.workspace = true
sha2.workspace = true
target-lexicon.workspace = true
thiserror.workspace = true
wasmparser.workspace = true

[dev-dependencies]
# The integration tests drive the runtime's AOT execution path.
parking_lot.workspace = true
wasmtiny = { workspace = true, features = ["aot"] }
wat.workspace = true

[features]
default = ["cli"]
cli = ["dep:clap"]
