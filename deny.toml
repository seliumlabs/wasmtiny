# cargo-deny configuration for wasmtiny.
# Static gate scoped to wasmtiny's own code and dependency tree —
# guests (tests/corpus) are exempt by design (docs/threat-model.md).
# CI runs: cargo deny --all-features check

[advisories]
# Fail on any known-vulnerable dependency.
version = 2
yanked = "deny"

[licenses]
version = 2
# wasmtiny is Apache-2.0 OR MIT; dev/test tooling may add permissive
# crates. Anything unlisted here fails the gate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]

[bans]
# Multiple versions of the same crate invite subtle divergence.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# hashbrown appears at three semver-incompatible versions pulled by the
# Cranelift stack: 0.13.2 (regalloc2), 0.14.5 (cranelift-codegen/wasmparser),
# 0.17.1 (indexmap/gimli). They cannot be unified; keep 0.14.5 as the
# checked version and skip the two outliers.
skip = [
    { name = "hashbrown", version = "=0.13.2" },
    { name = "hashbrown", version = "=0.17.1" },
]

[sources]
# Self-contained builds: no git or unregistered sources.
unknown-registry = "deny"
unknown-git = "deny"
